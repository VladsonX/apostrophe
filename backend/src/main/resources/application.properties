spring.jpa.hibernate.ddl-auto=update

s3.access.key=${S3_ACCESS_KEY}
s3.secret.key=${S3_SECRET_KEY}
s3.region.name=${SE_REGION_NAME}

jwt.key=${JWT_SECRET}